name = "replay-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://qvkynwlmzeybdiapbcsy.supabase.co"
REPLAY_SITE_URL = "https://replaycon.in"
BGC_WORKER_URL = "https://api.boardgamecompany.in"
UPI_ID = "suranjanadatta24-1@okaxis"
CF_ACCESS_TEAM_DOMAIN = "boardgamecompany.cloudflareaccess.com"
CF_ACCESS_AUD = "0983cd2ae4c9939c15d1ebecabe9d57a9630e8b09ada408279a9b17d3ecf132f"
ADMIN_ORIGIN = "https://admin.replaycon.in"
# The VAPID public key is public by definition -- browsers need it to subscribe.
# Its private half is a Worker secret (VAPID_PRIVATE_KEY) and is never committed.
VAPID_PUBLIC_KEY = "BN6D4NKA9S4FLFPB4fBA0MkkZzbZFQBDOHEjPLqSitjabqGYdWJ99EhwKUEMdLF-fhKUUQ3X0JP74Q8PWmv3LBs"
# Where a push service can reach us if a notification misbehaves.
VAPID_SUBJECT = "mailto:hello@replaycon.in"

# Session reminders. Every five minutes is frequent enough that the ten-minute
# send window never has a gap, and cheap enough to leave running year-round --
# outside the event dates the handler returns immediately.
[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "api.replaycon.in"
custom_domain = true

# Same-origin admin API: serve /api/admin/* on the admin host so the SPA makes
# same-origin calls (no CORS/preflight). admin.replaycon.in is already behind the
# CF Access app, so Cloudflare injects Cf-Access-Jwt-Assertion on these paths.
# Worker routes take precedence over the Pages project for this path prefix.
[[routes]]
pattern = "admin.replaycon.in/api/admin/*"
zone_name = "replaycon.in"

# Public write endpoints are throttled twice: once per client network and once
# per phone/registration subject. Namespace IDs only need to be unique within
# this Cloudflare account.
[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "91001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "SUBJECT_RATE_LIMITER"
namespace_id = "91002"

  [ratelimits.simple]
  limit = 10
  period = 60
